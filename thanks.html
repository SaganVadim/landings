<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiteBlend’e Teşekkürler - Kahve Tutkusunu Paylaşın!</title>
    <meta
      name="keywords"
      content="BiteBlend teşekkürler, kahve severler, müşteri memnuniyeti, kahve keyfi, kafe topluluğu, kaliteli kahve, kahve deneyimi"
    />
    <meta
      name="description"
      content="BiteBlend’i tercih ettiğiniz için teşekkür ederiz! Kahveye olan tutkunuzu bizimle paylaşarak eşsiz tatların keyfini çıkarın. Sizleri tekrar bekliyoruz!"
    />

    <style>
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        background-color: #f0f4f8;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        background-image: url("background.jpg");
        background-size: cover;
        background-position: center;
      }

      .container {
        text-align: center;
        max-width: 650px;
        padding: 30px;
        background: #ffffffe6;
        border-radius: 8px;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #1d6cff;
        font-size: 2.2em;
        margin-bottom: 20px;
      }

      p {
        color: #333;
        margin-bottom: 25px;
        font-size: 1.1em;
      }

      .btn {
        background-color: #1d6cff;
        color: white;
        padding: 12px 24px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        border-radius: 5px;
        transition: background-color 0.3s ease-in-out;
        font-weight: bold;
      }

      .btn:hover {
        background-color: #3f82fd;
      }
    </style>
  </head>

  <body>
    <main>
      <section>
        <div class="container">
          <h1>BiteBlend’i Tercih Ettiğiniz İçin Teşekkür Ederiz!</h1>
          <p>
            BiteBlend ekibi olarak kahve tutkunlarının topluluğumuza
            katılmasından büyük mutluluk duyuyoruz. Size en kaliteli kahve
            deneyimini sunmak ve her yudumda keyif almanızı sağlamak için
            buradayız.
          </p>
          <a href="index.html" class="btn">Ana Sayfaya Dön</a>
        </div>
      </section>
    </main>
  </body>
</html>
