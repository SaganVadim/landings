<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You - RhythmRise Dance School</title>
    <meta
      name="keywords"
      content="Thank you RhythmRise, dance registration, welcome to RhythmRise, dance school confirmation, join dance classes, dance school thanks"
    />
    <meta
      name="description"
      content="Thank you for joining RhythmRise! We're excited to have you as part of our dance community. Prepare to step into the rhythm and enjoy an inspiring journey filled with movement and joy."
    />

    <style>
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        background-color: #f0f4f8;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        background-image: url("background.jpg");
        background-size: cover;
        background-position: center;
      }

      .container {
        text-align: center;
        max-width: 650px;
        padding: 30px;
        background: #ffffffe6;
        border-radius: 8px;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #1d6cff;
        font-size: 2.2em;
        margin-bottom: 20px;
      }

      p {
        color: #333;
        margin-bottom: 25px;
        font-size: 1.1em;
      }

      .btn {
        background-color: #1d6cff;
        color: white;
        padding: 12px 24px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        border-radius: 5px;
        transition: background-color 0.3s ease-in-out;
        font-weight: bold;
      }

      .btn:hover {
        background-color: #3f82fd;
      }
    </style>
  </head>

  <body>
    <main>
      <section>
        <div class="container">
          <h1>Thank you for choosing RhythmRise!</h1>
          <p>
            The RhythmRise team is thrilled to have you join our vibrant dance
            community. We are here to inspire your passion for dance, help you
            achieve your goals, and make every step of your journey
            unforgettable.
          </p>
          <a href="index.html" class="btn">Back to Top</a>
        </div>
      </section>
    </main>
  </body>
</html>
