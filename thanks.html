<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Teşekkürler - ShimmerShack'e Güvendiğiniz İçin Teşekkür Ederiz
    </title>
    <meta
      name="keywords"
      content="ShimmerShack teşekkürler, müşteri memnuniyeti, takı alışverişi, zarif mücevherler, güvenilir mücevher mağazası"
    />
    <meta
      name="description"
      content="ShimmerShack'i seçtiğiniz için teşekkür ederiz. Zarif ve lüks mücevher koleksiyonlarımızla size hizmet etmekten gurur duyuyoruz. Keyifli alışverişler dileriz!"
    />

    <style>
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        background-color: #f0f4f8;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        background-image: url("background.jpg");
        background-size: cover;
        background-position: center;
      }

      .container {
        text-align: center;
        max-width: 650px;
        padding: 30px;
        background: #ffffffe6;
        border-radius: 8px;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #1d6cff;
        font-size: 2.2em;
        margin-bottom: 20px;
      }

      p {
        color: #333;
        margin-bottom: 25px;
        font-size: 1.1em;
      }

      .btn {
        background-color: #1d6cff;
        color: white;
        padding: 12px 24px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        border-radius: 5px;
        transition: background-color 0.3s ease-in-out;
        font-weight: bold;
      }

      .btn:hover {
        background-color: #3f82fd;
      }
    </style>
  </head>

  <body>
    <main>
      <section>
        <div class="container">
          <h1>ShimmerShack'e Hoş Geldiniz!</h1>
          <p>
            ShimmerShack ailesine katıldığınız için teşekkür ederiz! Takı
            severler topluluğumuzun bir parçası olduğunuz için mutluyuz. Sizlere
            zarafeti ve tarzı bir araya getiren eşsiz mücevher
            koleksiyonlarımızla hizmet etmekten gurur duyuyoruz.
          </p>
          <a href="index.html" class="btn">Başa Dön</a>
        </div>
      </section>
    </main>
  </body>
</html>
