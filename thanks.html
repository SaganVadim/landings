<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You - CheerBash</title>
    <meta
      name="keywords"
      content="CheerBash thank you, party booking confirmation, children's party planners, celebration services, customer gratitude"
    />
    <meta
      name="description"
      content="Thank you for choosing CheerBash! We're excited to bring your child's dream party to life. Let's create unforgettable memories together."
    />

    <style>
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        background-color: #f0f4f8;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        background-image: url("background.jpg");
        background-size: cover;
        background-position: center;
      }

      .container {
        text-align: center;
        max-width: 650px;
        padding: 30px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 8px;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #4f4cfe;
        font-size: 2.2em;
        margin-bottom: 20px;
      }

      p {
        color: #333;
        margin-bottom: 25px;
        font-size: 1.1em;
      }

      .btn {
        background-color: #4f4cfe;
        color: white;
        padding: 12px 24px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        border-radius: 5px;
        transition: background-color 0.3s ease-in-out;
        font-weight: bold;
      }

      .btn:hover {
        background-color: #3532d6;
      }
    </style>
  </head>

  <body>
    <main>
      <section>
        <div class="container">
          <h1>Thank You for Celebrating with CheerBash!</h1>
          <p>
            The CheerBash team is overjoyed to have been part of your special
            moments. We’re here to create unforgettable parties filled with
            laughter, joy, and magical memories for kids and their loved ones.
          </p>
          <a href="index.html" class="btn">Back to Home</a>
        </div>
      </section>
    </main>
  </body>
</html>
