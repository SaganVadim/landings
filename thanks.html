<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WheelWonders'a Hoşgeldiniz, Teşekkür Ederiz!</title>
    <meta
      name="keywords"
      content="teşekkür, WheelWonders, sipariş onayı, satın alma tamamlandı, teşekkür mesajı"
    />
    <meta
      name="description"
      content="WheelWonders'tan yaptığınız alışveriş için teşekkür ederiz! Siparişiniz onaylandı ve bisiklet ihtiyaçlarınıza yardımcı olmak için sabırsızlanıyoruz. Desteğiniz için teşekkür ederiz!"
    />

    <style>
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        background-color: #f0f4f8;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        background-image: url("background.jpg");
        background-size: cover;
        background-position: center;
      }

      .container {
        text-align: center;
        max-width: 650px;
        padding: 30px;
        background: #ffffffe6;
        border-radius: 8px;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #fa4533;
        font-size: 2.2em;
        margin-bottom: 20px;
      }

      p {
        color: #333;
        margin-bottom: 25px;
        font-size: 1.1em;
      }

      .btn {
        background-color: #fa4533;
        color: white;
        padding: 12px 24px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        border-radius: 5px;
        transition: background-color 0.3s ease-in-out;
        font-weight: bold;
      }

      .btn:hover {
        background-color: #c82d1e;
      }
    </style>
  </head>

  <body>
    <main>
      <section>
        <div class="container">
          <h1>WheelWonders'i tercih ettiğiniz için teşekkür ederiz!</h1>
          <p>
            WheelWonders ekibi olarak, bisiklet ve aksesuar tutkunları
            topluluğumuza katıldığınız için çok mutluyuz.
          </p>
          <a href="index.html" class="btn">Başa Dön</a>
        </div>
      </section>
    </main>
  </body>
</html>
