<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teşekkürler - PocketPinnacle Ailesine Hoş Geldiniz</title>
    <meta
      name="keywords"
      content="PocketPinnacle teşekkürler, alışveriş onayı, müşteri memnuniyeti, telefon aksesuar mağazası, alışveriş başarıyla tamamlandı, PocketPinnacle ailesine katılın"
    />
    <meta
      name="description"
      content="PocketPinnacle'da alışveriş yaptığınız için teşekkür ederiz! Size en iyi akıllı telefon aksesuarlarını sunmaktan mutluluk duyuyoruz. Kalite ve müşteri memnuniyeti için her zaman buradayız. Yeniden görüşmek dileğiyle!"
    />

    <style>
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        background-color: #121d1d;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        background-image: url("background.jpg");
        background-size: cover;
        background-position: center;
      }

      .container {
        text-align: center;
        max-width: 650px;
        padding: 30px;
        background: #182c2c;
        border-radius: 8px;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #ff715b;
        font-size: 2.2em;
        margin-bottom: 20px;
      }

      p {
        color: #dcdcdc;
        margin-bottom: 25px;
        font-size: 1.1em;
      }

      .btn {
        background-color: #ff715b;
        color: white;
        padding: 12px 24px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        border-radius: 5px;
        transition: background-color 0.3s ease-in-out;
        font-weight: bold;
      }

      .btn:hover {
        background-color: #c6513f;
      }
    </style>
  </head>

  <body>
    <main>
      <section>
        <div class="container">
          <h1>PocketPinnacle'ı Tercih Ettiğiniz İçin Teşekkür Ederiz!</h1>
          <p>
            PocketPinnacle ailesi olarak, teknoloji tutkunları topluluğumuza
            katıldığınız için çok mutluyuz. Amacımız, akıllı telefon
            aksesuarlarında yüksek kaliteyi ve benzersiz hizmeti size sunarak
            deneyiminizi en üst düzeye çıkarmaktır.
          </p>
          <a href="index.html" class="btn">Başa Dön</a>
        </div>
      </section>
    </main>
  </body>
</html>
