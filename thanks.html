<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You for Shopping with DIYDen!</title>
    <meta
      name="keywords"
      content="Thank you, DIYDen, order confirmation, creative supplies, hobby store, craft materials"
    />
    <meta
      name="description"
      content="Thank you for choosing DIYDen! We appreciate your support and can't wait to help you with your next DIY or creative project. Happy crafting!"
    />

    <style>
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        background-color: #12141d;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        background-image: url("background.jpg");
        background-size: cover;
        background-position: center;
      }

      .container {
        text-align: center;
        max-width: 650px;
        padding: 30px;
        background: #1f2232;
        border-radius: 8px;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #ff705b;
        font-size: 2.2em;
        margin-bottom: 20px;
      }

      p {
        color: #eee;
        margin-bottom: 25px;
        font-size: 1.1em;
      }

      .btn {
        background-color: #ff705b;
        color: white;
        padding: 12px 24px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        border-radius: 5px;
        transition: background-color 0.3s ease-in-out;
        font-weight: bold;
      }

      .btn:hover {
        background-color: #a64e41;
      }
    </style>
  </head>

  <body>
    <main>
      <section>
        <div class="container">
          <h1>Thank You for Choosing DIYDen!</h1>
          <p>
            The DIYDen team is thrilled to welcome you to our creative
            community!
          </p>

          <a href="index.html" class="btn">Back to Home</a>
        </div>
      </section>
    </main>
  </body>
</html>
