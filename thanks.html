<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You for Choosing SellSure</title>
    <meta
      name="keywords"
      content="Thank you SellSure, sales training enrollment, professional development, sales success, improve selling skills"
    />
    <meta
      name="description"
      content="Thank you for joining SellSure! We’re excited to help you unlock your potential and master the art of selling. Let’s start your journey toward sales success together."
    />

    <style>
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        background-color: #0f0f0f;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        background-image: url("background.jpg");
        background-size: cover;
        background-position: center;
      }

      .container {
        text-align: center;
        max-width: 650px;
        padding: 30px;
        background: #434343e6;
        border-radius: 8px;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #1d8340;
        font-size: 2.2em;
        margin-bottom: 20px;
      }

      p {
        color: #eee;
        margin-bottom: 25px;
        font-size: 1.1em;
      }

      .btn {
        background-color: #1d8340;
        color: white;
        padding: 12px 24px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        border-radius: 5px;
        transition: background-color 0.3s ease-in-out;
        font-weight: bold;
      }

      .btn:hover {
        background-color: #125027;
      }
    </style>
  </head>

  <body>
    <main>
      <section>
        <div class="container">
          <h1>Thank you for choosing SizzleSphere!</h1>
          <p>
            We're here to elevate your kitchen experience with premium
            appliances and utensils designed to inspire creativity and
            convenience.
          </p>
          <a href="index.html" class="btn">Back to Top</a>
        </div>
      </section>
    </main>
  </body>
</html>
