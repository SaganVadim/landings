<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You for Choosing PetalPalace</title>
    <meta
      name="keywords"
      content="PetalPalace thank you, plant lovers, customer appreciation, shop plants online, green living"
    />
    <meta
      name="description"
      content="Thank you for being part of the PetalPalace community! We are thrilled to help you bring greenery into your life. Explore our wide range of plants and let’s grow together."
    />

    <style>
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        background-color: #f0f4f8;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        background-image: url("background.jpg");
        background-size: cover;
        background-position: center;
      }

      .container {
        text-align: center;
        max-width: 650px;
        padding: 30px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 8px;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #1b7d93;
        font-size: 2.2em;
        margin-bottom: 20px;
      }

      p {
        color: #333;
        margin-bottom: 25px;
        font-size: 1.1em;
      }

      .btn {
        background-color: #1b7d93;
        color: white;
        padding: 12px 24px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        border-radius: 5px;
        transition: background-color 0.3s ease-in-out;
        font-weight: bold;
      }

      .btn:hover {
        background-color: rgb(30, 131, 131);
      }

  <body>

        </div>
