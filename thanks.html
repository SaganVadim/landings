<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thank You for Visiting StorySafari!</title>
    <meta
      name="keywords"
      content="StorySafari, thank you, bookstore, customer appreciation, books"
    />
    <meta
      name="description"
      content="Thank you for visiting StorySafari! We appreciate your interest in our bookstore. Stay connected with us for more book recommendations, updates, and special offers. Happy reading!"
    />

    <style>
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        background-color: #f0f4f8;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        background-image: url("background.jpg");
        background-size: cover;
        background-position: center;
      }

      .container {
        text-align: center;
        max-width: 650px;
        padding: 30px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 8px;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #175858;
        font-size: 2.2em;
        margin-bottom: 20px;
      }

      p {
        color: #333;
        margin-bottom: 25px;
        font-size: 1.1em;
      }

      .btn {
        background-color: #175858;
        color: white;
        padding: 12px 24px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        border-radius: 5px;
        transition: background-color 0.3s ease-in-out;
        font-weight: bold;
      }

      .btn:hover {
        background-color: rgb(30, 131, 131);
      }
    </style>
  </head>

  <body>
    <main>
      <section>
        <div class="container">
          <h1>Thank You for Joining StorySafari!</h1>

          <p>
            Our curated collection is designed to offer you a variety of genres,
            from the magical to the thought-provoking. We believe every story
            has the power to change your world, and we can't wait to be part of
            your literary journey.
          </p>
          <a href="index.html" class="btn">Return to Bookish Bliss</a>
        </div>
      </section>
    </main>
  </body>
</html>
