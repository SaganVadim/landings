<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TailTutor'a Hoş Geldiniz - Teşekkürler!</title>
    <meta
      name="keywords"
      content="TailTutor teşekkürler, kayıt başarıyla tamamlandı, evcil hayvan eğitimi, dostunuz için eğitim, TailTutor topluluğu"
    />
    <meta
      name="description"
      content="TailTutor ailesine katıldığınız için teşekkür ederiz! Sizi ve evcil dostunuzu daha yakından tanımak ve en iyi eğitimi sunmak için sabırsızlanıyoruz. Hemen eğitim yolculuğuna başlayın!"
    />

    <style>
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        background-color: #f0f4f8;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        background-image: url("background.jpg");
        background-size: cover;
        background-position: center;
      }

      .container {
        text-align: center;
        max-width: 650px;
        padding: 30px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 8px;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #4a42df;
        font-size: 2.2em;
        margin-bottom: 20px;
      }

      p {
        color: #333;
        margin-bottom: 25px;
        font-size: 1.1em;
      }

      .btn {
        background-color: #4a42df;
        color: white;
        padding: 12px 24px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        border-radius: 5px;
        transition: background-color 0.3s ease-in-out;
        font-weight: bold;
      }

      .btn:hover {
        background-color: #27219a;
      }
    </style>
  </head>

  <body>
    <main>
      <section>
        <div class="container">
          <h1>TailTutor Ailesine Hoş Geldiniz!</h1>
          <p>
            TailTutor ekibi olarak sizi aramızda görmekten büyük mutluluk
            duyuyoruz. Dostunuzun eğitimi ve mutluluğu için birlikte harika bir
            yolculuğa çıkacağız!
          </p>

          <a href="index.html" class="btn">Anasayfaya Dön</a>
        </div>
      </section>
    </main>
  </body>
</html>
