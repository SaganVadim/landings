<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="keywords"
      content="BizHive, obrigado, aluguel de escritórios, espaço de trabalho, agradecimento"

      name="description"
      content="Agradecemos por escolher a BizHive! Estamos felizes em ajudar você a encontrar o espaço de escritório perfeito. Em breve, você começará a aproveitar todos os benefícios de nosso ambiente de trabalho flexível e profissional."

    <style>
      body {
        font-family: "Helvetica Neue", Arial, sans-serif;
        background-color: #f0f4f8;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        background-image: url("background.jpg");
        background-size: cover;
        background-position: center;
      }

      .container {
        text-align: center;
        max-width: 650px;
        padding: 30px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 8px;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #775135;
        font-size: 2.2em;
        margin-bottom: 20px;
      }

      p {
        color: #333;
        margin-bottom: 25px;
        font-size: 1.1em;
      }

      .btn {
        background-color: #775135;
        color: white;
        padding: 12px 24px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        border-radius: 5px;
        transition: background-color 0.3s ease-in-out;
        font-weight: bold;
      }

      .btn:hover {
